name: Run Unibet Forward Backtests (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Match date to capture manually (YYYY-MM-DD)"
        required: true

concurrency:
  group: teamstats-db-sync
  cancel-in-progress: false

jobs:
  unibet-forward-backtests:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      BASE_URL: ${{ secrets.BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run manual forward backtest
        shell: bash
        run: |
          TARGET_DATE="${{ github.event.inputs.date }}"
          echo "Running forward backtest for $TARGET_DATE"
          node scripts/run-unibet-forward-backtests.js --date="$TARGET_DATE"
