name: Import fixtures (D+7 only)

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC dagligen
  workflow_dispatch: {}

concurrency:
  group: import-fixtures-dplus7
  cancel-in-progress: false

jobs:
  run-script:
    name: Fetch fixtures for D+7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # (Valfritt) Hotfix om axios saknas i lockfile
      - name: Hotfix - install axios (missing in lockfile)
        run: |
          npm install --no-save axios@^1

      # Installera lib:ar som Chrome kräver på ubuntu-latest
      - name: Install system deps for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libxss1 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxrandr2 libgbm1 \
            libgtk-3-0 libasound2

      # Patcha Puppeteer launch så den kör utan sandbox i CI
      - name: Patch puppeteer launch flags (no-sandbox on CI)
        run: |
          sed -i "s/puppeteer.launch({ headless: \\\"new\\\" })/puppeteer.launch({ headless: \\\"new\\\", args: ['--no-sandbox','--disable-setuid-sandbox'] })/g" scripts/fetch-and-import-fixtures.js

      - name: Compute D+7 (UTC)
        id: dates
        run: echo "TARGET=$(date -u -d '+7 days' +%F)" >> $GITHUB_OUTPUT

      - name: Run fixtures import script for D+7
        run: |
          echo "▶ Kör fixtures-script för ${{ steps.dates.outputs.TARGET }}"
          node scripts/fetch-and-import-fixtures.js "${{ steps.dates.outputs.TARGET }}"
