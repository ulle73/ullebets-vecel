name: Import fixtures (D+7 only)

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC every day
  workflow_dispatch: {}

concurrency:
  group: import-fixtures-dplus7
  cancel-in-progress: false

jobs:
  run-script:
    name: Fetch fixtures for D+7 (Ubuntu runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Puppeteer system libraries
        run: |
          sudo apt-get update
          # minimal needed for headless chromium on ubuntu runners
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libxss1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libcups2 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpangocairo-1.0-0 \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # (Hotfix) if axios isn't in your lockfile, install it without touching repo
      - name: Ensure axios is present
        run: node -e "try{require('axios');process.exit(0)}catch(e){process.exit(1)}" || npm i --no-save axios@^1

      - name: Compute D+7 (UTC)
        id: dates
        run: echo "TARGET=$(date -u -d '+7 days' +%F)" >> $GITHUB_OUTPUT

      - name: Run fixtures import script for D+7
        env:
          TARGET: ${{ steps.dates.outputs.TARGET }}
        run: |
          echo "▶ Kör fixtures-script för $TARGET"
          node scripts/fetch-and-import-fixtures.js "$TARGET"
