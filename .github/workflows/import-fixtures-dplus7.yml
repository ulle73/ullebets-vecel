name: Import fixtures (D+7 only)

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC dagligen
  workflow_dispatch: {}

concurrency:
  group: import-fixtures-dplus7
  cancel-in-progress: false

jobs:
  run-script:
    name: Fetch fixtures for D+7 (Puppeteer container)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Räkna fram D+7 och exponera som env TARGET
      - name: Compute D+7 (UTC)
        run: echo "TARGET=$(date -u -d '+7 days' +%F)" >> $GITHUB_ENV

      # Kör allt inne i Puppeteer-containern (Chrome + Node redan klart)
      - name: Run import in Puppeteer container
        uses: tj-actions/docker-run@v2
        with:
          image: ghcr.io/puppeteer/puppeteer:21.3.8
          name: puppeteer-chrome
          # Mounta workspace, sätt working dir och för in våra env-nycklar
          options: >-
            --init
            -v ${{ github.workspace }}:${{ github.workspace }}
            -w ${{ github.workspace }}
            -e MONGODB_URI=${{ env.MONGODB_URI }}
            -e MONGODB_DB=${{ env.MONGODB_DB }}
            -e RAPIDAPI_KEYS=${{ env.RAPIDAPI_KEYS }}
            -e TARGET=${{ env.TARGET }}
          args: >
            bash -lc "
              node -v &&
              npm -v &&
              npm ci &&
              # (Hotfix) om axios saknas i lockfile: installera utan att påverka repo
              (node -e \"try{require('axios');console.log('axios ok')}catch(e){process.exit(1)}\" || npm i --no-save axios@^1) &&
              echo '▶ Kör fixtures-script för' \"$TARGET\" &&
              node scripts/fetch-and-import-fixtures.js \"$TARGET\"
            "
