name: Import fixtures (D+7 only)

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: import-fixtures-dplus7
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-script:
    name: Fetch fixtures for D+7 (Ubuntu runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Puppeteer system libraries (handle Ubuntu 24.04 t64)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update

          # Try install standard packages
          BASE_PKGS=(
            libnss3
            libxss1
            libatk-bridge2.0-0
            libgtk-3-0
            libcups2
            libx11-xcb1
            libxcomposite1
            libxdamage1
            libxfixes3
            libxrandr2
            libpangocairo-1.0-0
            xdg-utils
          )
          sudo apt-get install -y --no-install-recommends "${BASE_PKGS[@]}"

          # Packages that may be renamed to *t64 on Ubuntu 24.04
          # Try non-t64 first, then fall back to t64
          sudo apt-get install -y --no-install-recommends libgbm1 || sudo apt-get install -y --no-install-recommends libgbm1t64
          sudo apt-get install -y --no-install-recommends libasound2 || sudo apt-get install -y --no-install-recommends libasound2t64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Hotfix if axios is missing in lockfile/repo (keeps repo clean)
      - name: Ensure axios is present
        run: node -e "try{require('axios');process.exit(0)}catch(e){process.exit(1)}" || npm i --no-save axios@^1

      - name: Compute D+7 (UTC)
        id: dates
        run: echo "TARGET=$(date -u -d '+7 days' +%F)" >> "$GITHUB_OUTPUT"

      - name: Run fixtures import script for D+7
        env:
          TARGET: ${{ steps.dates.outputs.TARGET }}
        run: |
          echo "▶ Kör fixtures-script för $TARGET"
          node scripts/fetch-and-import-fixtures.js "$TARGET"

      - name: Commit & push teamstats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teamstats/*.json public/teamstats/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(teamstats): update JSON data [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
