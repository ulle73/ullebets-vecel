name: Enrich matchups results

on:
  schedule:
    - cron: "0 7 * * *"  # Varje dag kl 07:00 UTC, för att rätta nyligen avslutade matcher
  workflow_dispatch:
    inputs:
      target-date:
        description: "Date or range to enrich (YYYY-MM-DD or YYYY-MM-DD-YYYY-MM-DD)."
        required: false

concurrency:
  group: teamstats-db-sync
  queue: max
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Set date (yesterday or manual)
        id: set-date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target-date }}" ]; then
            DATE="${{ github.event.inputs.target-date }}"
          else
            START_DATE=$(date -u -d '7 days ago' +'%Y-%m-%d')
            END_DATE=$(date -u -d 'yesterday' +'%Y-%m-%d')
            DATE="${START_DATE}-${END_DATE}"
          fi
          echo "DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Enrich matchups results
        run: node scripts/enrich-matchups-results.js --date=${{ env.DATE }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          RAPIDAPI_SPORTAPI7_BASE_URL: ${{ secrets.RAPIDAPI_SPORTAPI7_BASE_URL }}
          RAPIDAPI_SOFASCORE_BASE_URL: ${{ secrets.RAPIDAPI_SOFASCORE_BASE_URL }}
          RAPIDAPI_SPORT_API_REAL_TIME_BASE_URL: ${{ secrets.RAPIDAPI_SPORT_API_REAL_TIME_BASE_URL }}
          RAPIDAPI_SOFASCORE_SPORT_API_BASE_URL: ${{ secrets.RAPIDAPI_SOFASCORE_SPORT_API_BASE_URL }}
          RAPIDAPI_SOFASPORT_BASE_URL: ${{ secrets.RAPIDAPI_SOFASPORT_BASE_URL }}
          SOFASCORE_PUBLIC_API_BASE_URL: ${{ secrets.SOFASCORE_PUBLIC_API_BASE_URL }}
