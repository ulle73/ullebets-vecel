name: Enrich matchups results

on:
  schedule:
    - cron: "0 7 * * *"  # Varje dag kl 01:00 UTC (när matcher från igår är klara)
  workflow_dispatch:
    inputs:
      target-date:
        description: "Date to enrich (YYYY-MM-DD), defaults to yesterday."
        required: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Set date (yesterday or manual)
        id: set-date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target-date }}" ]; then
            DATE="${{ github.event.inputs.target-date }}"
          else
            DATE=$(date -u -d 'yesterday' +'%Y-%m-%d')
          fi
          echo "DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Enrich matchups results
        run: node scripts/enrich-matchups-results.js --date=${{ env.DATE }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
