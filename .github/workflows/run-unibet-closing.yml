name: Run Unibet Closing Odds (manual)

on:
  workflow_dispatch: {}

concurrency:
  group: teamstats-db-sync
  cancel-in-progress: false

jobs:
  unibet-closing:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      BASE_URL: ${{ secrets.BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run closing odds
        run: node scripts/run-unibet-closing.js
