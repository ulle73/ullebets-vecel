name: Daily Backtest Correction

on:
  schedule:
    # Run daily at 9 AM CET (8 AM UTC)
    - cron: '0 8 * * *'
  
  workflow_dispatch:
    # Allow manual trigger

jobs:
  correct-backtests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Correct backtest predictions
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          echo "🔧 Correcting backtest predictions with actual match results..."
          node scripts/correct-unibet-backtest.js
      
      - name: Summary
        if: always()
        run: |
          echo "✅ Backtest correction completed!"
          echo "Match results have been updated in MongoDB"
