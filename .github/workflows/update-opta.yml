name: Update Opta Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-opta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update Opta IDs and ratings
        run: node scripts/update-opta-id.js
