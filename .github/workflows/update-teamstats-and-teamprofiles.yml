name: Update teamstats (yesterday) & generate profiles

on:
  workflow_dispatch:
    inputs:
      skip_generate_profiles:
        description: "Hoppa över generering av teamprofiler"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  schedule:
    - cron: "0 5 * * *"     

concurrency:
  group: teamstats
  cancel-in-progress: false

jobs:
  run:
    name: update-teams-v2.js --yesterday → import → generate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
      SKIP_GENERATE: ${{ github.event.inputs.skip_generate_profiles || 'false' }}
      # 👇 Tvinga skriptet att skriva till repo-mappar (Linux-vänligt)
      TEAMSTATS_DIR: ${{ github.workspace }}/data/teamstats
      PUBLIC_TEAMSTATS_DIR: ${{ github.workspace }}/public/teamstats
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install axios if missing
        run: |
          node -e "try{require('axios');process.exit(0)}catch(e){process.exit(1)}" || npm i --no-save axios@^1

      - name: Install Chrome deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcb1 \
            libxdamage1 \
            libxfixes3 \
            libxcomposite1 \
            libxrandr2 \
            libxi6 \
            libcups2 \
            libxkbcommon0 \
            libdrm2 \
            libasound2t64

      - name: Run update-teams-v2.js --yesterday
        env:
          PUPPETEER_INFO: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --no-zygote --no-first-run"
        run: |
          echo "▶ Kör update-teams-v2.js --yesterday"
          node scripts/update-teams-v2.js --yesterday

      - name: Check for data/teamstats
        id: has_teamstats
        run: |
          if [ -d "$TEAMSTATS_DIR" ] && find "$TEAMSTATS_DIR" -type f -name "*.json" -print -quit | grep -q .; then
            echo "present=true" >> $GITHUB_OUTPUT
            echo "✅ Hittade teamstats-filer i $TEAMSTATS_DIR"
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "⏭️ Inga teamstats-filer hittades i $TEAMSTATS_DIR; hoppar import/generate."
          fi

      - name: Import teamstats into MongoDB
        if: steps.has_teamstats.outputs.present == 'true'
        run: node scripts/import-teamstats.js

      - name: Generate team profiles
        if: steps.has_teamstats.outputs.present == 'true' && env.SKIP_GENERATE != 'true'
        run: node scripts/generate-teamprofiles.js

      - name: Check MongoDB counts
        if: steps.has_teamstats.outputs.present == 'true'
        run: node scripts/check-teamstats-count.js
