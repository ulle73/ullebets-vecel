name: update-teamstats-and-teamprofiles

on:
  workflow_dispatch:
    inputs:
      skip_generate_profiles:
        description: "Hoppa över generering av teamprofiler"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: teamstats
  cancel-in-progress: false

jobs:
  import:
    name: Import teamstats data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      SKIP_GENERATE: ${{ github.event.inputs.skip_generate_profiles || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Import teamstats JSON files
        run: node scripts/import-teamstats.js

      - name: Generate team profiles
        if: env.SKIP_GENERATE != 'true'
        run: node scripts/generate-teamprofiles.js

      - name: Check MongoDB counts
        run: node scripts/check-teamstats-count.js
