name: Apply Mongo reconnect guard patch

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-mongo-reconnect-guard-patch.mjs
      - .github/workflows/apply-mongo-reconnect-guard-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', 'Guard Mongo reconnect during teamstats DB sync') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/apply-mongo-reconnect-guard-patch.mjs

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-mongo-reconnect-guard-patch.mjs
          rm .github/workflows/apply-mongo-reconnect-guard-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-teams-v2.js scripts/apply-mongo-reconnect-guard-patch.mjs .github/workflows/apply-mongo-reconnect-guard-patch.yml
          git commit -m "Guard Mongo reconnect during teamstats DB sync"
          git push
