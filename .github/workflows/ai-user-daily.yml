name: AI User Daily

on:
  schedule:
    - cron: "0 11 * * *" # 09:00 Stockholm
  workflow_call:
    inputs:
      dates:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      dates:
        description: "Datum (YYYY-MM-DD), kommaseparerade eller mellanslag. Tomt = idag + imorgon + +2 + +3 + +4 (Stockholm). Max 5."
        required: false
        default: ""

concurrency:
  group: teamstats-db-sync
  queue: max
  cancel-in-progress: false

jobs:
  ai-user-daily:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.VERCEL_APP_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kör samma flöde som /ai/user (Generate Bets)
        env:
          INPUT_DATES: ${{ inputs.dates || github.event.inputs.dates }}
          BASE_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          node - <<'NODE'
          import fs from "fs";

          const baseUrl = process.env.BASE_URL;
          if (!baseUrl) {
            throw new Error("BASE_URL saknas (secrets.VERCEL_APP_URL).");
          }

          const rawDates = process.env.INPUT_DATES || "";
          const parseDates = (raw) =>
            raw
              .split(/[,\\s]+/)
              .map((d) => d.trim())
              .filter(Boolean);

          const formatDate = (offsetDays = 0) => {
            const now = new Date();
            const target = new Date(now);
            target.setUTCDate(target.getUTCDate() + offsetDays);
            const parts = new Intl.DateTimeFormat("sv-SE", {
              timeZone: "Europe/Stockholm",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            })
              .formatToParts(target)
              .reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
            return `${parts.year}-${parts.month}-${parts.day}`;
          };

          const todayStr = formatDate(0);
          const tomorrowStr = formatDate(1);
          const dayAfterTomorrowStr = formatDate(2);
          const plusThreeStr = formatDate(3);
          const plusFourStr = formatDate(4);
          const defaultDates = [todayStr, tomorrowStr, dayAfterTomorrowStr, plusThreeStr, plusFourStr];

          const dates = parseDates(rawDates);
          const selectedDates = dates.length ? dates : defaultDates;

          if (!selectedDates.length || !selectedDates[0]) {
            throw new Error("Välj minst ett datum innan du genererar spel.");
          }

          if (selectedDates.length > 5) {
            throw new Error("Du kan max välja 5 datum samtidigt för att undvika överbelastning.");
          }

          const pastDates = selectedDates.filter((d) => d < todayStr);
          const futureDates = selectedDates.filter((d) => d >= todayStr);

          if (pastDates.length && futureDates.length) {
            throw new Error("Du kan inte blanda historiska datum med dagens/framtidens datum.");
          }

          const historyMode = pastDates.length > 0;
          const targetDates = historyMode ? pastDates : selectedDates;
          const endpoint = historyMode ? "/api/ai/history" : "/api/ai/generate-user";

          console.log(`Kör ${historyMode ? "historik" : "AI-generering"} för datum: ${targetDates.join(", ")}`);

          const results = [];

          const postJson = async (date) => {
            const res = await fetch(`${baseUrl}${endpoint}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ date }),
            });

            const text = await res.text();
            let payload = null;
            try {
              payload = JSON.parse(text);
            } catch {
              payload = { raw: text };
            }

            results.push({ date, ok: res.ok, status: res.status, payload });

            if (!res.ok) {
              console.error(`❌ ${date} (${res.status})`, payload?.error || text);
            } else if (historyMode) {
              const count = Array.isArray(payload?.bets) ? payload.bets.length : 0;
              console.log(`ℹ️ ${date}: hämtade ${count} sparade spel`);
            } else {
              console.log(
                `✅ ${date}: sparade ${payload?.totalBetsSaved ?? "?"} spel över ${payload?.matchesCount ?? "?"} matcher`
              );
            }
          };

          for (const date of targetDates) {
            await postJson(date);
          }

          const summaryLines = [];
          summaryLines.push(`## AI User Daily (${historyMode ? "historik" : "generering"})`);
          summaryLines.push(`- Base URL: ${baseUrl}`);
          summaryLines.push(`- Datum: ${targetDates.join(", ")}`);
          summaryLines.push(`- Läser endpoint: ${historyMode ? "/api/ai/history" : "/api/ai/generate-user"}`);
          summaryLines.push("");
          results.forEach((r) => {
            if (historyMode) {
              const count = Array.isArray(r.payload?.bets) ? r.payload.bets.length : 0;
              summaryLines.push(
                `- ${r.date}: ${r.ok ? "OK" : "FAILED"} (${r.status}) – ${count} bets returnerade`
              );
            } else {
              summaryLines.push(
                `- ${r.date}: ${r.ok ? "OK" : "FAILED"} (${r.status}) – ${r.payload?.totalBetsSaved ?? 0} bets sparade, ${r.payload?.matchesCount ?? 0} matcher`
              );
            }
          });

          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines.join("\n") + "\n");
          }

          if (results.some((r) => !r.ok)) {
            process.exit(1);
          }
          NODE
