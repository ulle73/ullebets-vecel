name: AI User Closing (Pre-Kickoff)

on:
  # Kör ofta runt matchstart (samma fönster som closing-odds, ca 15-min intervall kvällstid + helgdag)
  schedule:
    # Vardagar (mån–fre): 18:15–18:45, sedan 19:00–23:45 UTC (≈19:15–00:45 SE)
    - cron: "15,30,45 18 * * 1-5"
    - cron: "0,15,30,45 19-23 * * 1-5"
    - cron: "0 0 * * 2-6" # täcker 00:00 UTC tis–lör (≈01:00 SE)
    # Helger (lör–sön): 12:30–12:45, sedan 13:00–23:45 UTC (≈13:30–00:45 SE)
    - cron: "30,45 12 * * 6,0"
    - cron: "0,15,30,45 13-23 * * 6,0"
  workflow_dispatch:
    inputs:
      dates:
        description: "Datum (YYYY-MM-DD), kommaseparerade eller mellanslag. Tomt = default (idag+imorgon+ +2)."
        required: false
        default: ""

jobs:
  ai-user-closing:
    uses: ./.github/workflows/ai-user-daily.yml
    secrets: inherit
    with:
      dates: ${{ inputs.dates }}
