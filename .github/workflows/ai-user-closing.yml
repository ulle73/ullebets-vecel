name: AI User Closing (Pre-Kickoff)

on:
  # Kör ofta runt matchstart (samma fönster som closing-odds, ca 15-min intervall kvällstid + helgdag)
  schedule:
    # Vardagar (mån-fre): 18:15–23:45 UTC (≈ 19:15–00:45 SE)
    - cron: "15 18-23/1 * * 1-5"
    - cron: "30 18-23/1 * * 1-5"
    - cron: "45 18-23/1 * * 1-5"
    - cron: "00 19-23/1 * * 1-5"
    - cron: "15 19-23/1 * * 1-5"
    - cron: "30 19-23/1 * * 1-5"
    - cron: "45 19-23/1 * * 1-5"
    - cron: "00 0 * * 2-6"
    # Helger (lör-sön): 12:30–23:45 UTC (≈ 13:30–00:45 SE)
    - cron: "30 12-23/1 * * 6,0"
    - cron: "45 12-23/1 * * 6,0"
    - cron: "00 13-23/1 * * 6,0"
    - cron: "15 13-23/1 * * 6,0"
    - cron: "30 13-23/1 * * 6,0"
    - cron: "45 13-23/1 * * 6,0"
  workflow_dispatch:
    inputs:
      dates:
        description: "Datum (YYYY-MM-DD), kommaseparerade eller mellanslag. Tomt = default (idag+imorgon+ +2)."
        required: false
        default: ""

jobs:
  ai-user-closing:
    uses: ./.github/workflows/ai-user-daily.yml
    secrets: inherit
    with:
      dates: ${{ inputs.dates }}
