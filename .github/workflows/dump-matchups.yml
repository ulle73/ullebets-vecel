name: Dump matchups

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      target-date:
        description: "Match date (YYYY-MM-DD), defaults to D+7."
        required: false
  workflow_run:
    workflows:
      - Import fixtures (D+7 only)
    types:
      - completed

concurrency:
  group: teamstats-db-sync
  cancel-in-progress: false

jobs:
  run-matchups:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Set date (D+7)
        id: set-date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target-date }}" ]; then
            DATE="${{ github.event.inputs.target-date }}"
          else
            DATE=$(date -u -d '+7 days' +'%Y-%m-%d')
          fi
          echo "DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Dump matchups into MongoDB
        run: node scripts/dump-matchups.js --date=${{ env.DATE }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}

      - name: Dump league average matchups
        run: node scripts/dump-matchups-league-avg.js --date=${{ env.DATE }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
