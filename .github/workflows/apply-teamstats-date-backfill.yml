name: Apply teamstats date backfill patch

on:
  push:
    branches:
      - debug/rapidapi-endpoints
    paths:
      - scripts/apply-teamstats-date-backfill.mjs
      - .github/workflows/apply-teamstats-date-backfill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', 'Add teamstats forced date backfill') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/rapidapi-endpoints

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/apply-teamstats-date-backfill.mjs

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-teamstats-date-backfill.mjs
          rm .github/workflows/apply-teamstats-date-backfill.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-teams-v2.js scripts/apply-teamstats-date-backfill.mjs .github/workflows/apply-teamstats-date-backfill.yml
          git commit -m "Add teamstats forced date backfill"
          git push
