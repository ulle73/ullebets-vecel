name: Sync team profiles to MongoDB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

concurrency:
  group: sync-teamprofiles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate & sync team profiles
        run: node scripts/generate-teamprofiles.js
