name: Import fixtures (7 days ahead)

on:
  schedule:
    - cron: "0 5 * * *"   # kör varje dag 05:00 UTC
  workflow_dispatch:
    inputs:
      date_range:
        description: "Valfritt datum eller intervall (YYYY-MM-DD eller YYYY-MM-DD-YYYY-MM-DD). Lämna tomt för 'idag–+7 dagar'."
        required: false
        type: string

concurrency:
  group: import-fixtures
  cancel-in-progress: false

jobs:
  run-script:
    name: Fetch & import fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute date range (today → +7 days)
        id: daterange
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.date_range }}" ]]; then
            RANGE="${{ github.event.inputs.date_range }}"
          else
            START=$(date -u +%F)
            END=$(date -u -d "+7 days" +%F)
            RANGE="${START}-${END}"
          fi
          echo "Using DATE_RANGE=${RANGE}"
          echo "DATE_RANGE=${RANGE}" >> $GITHUB_OUTPUT

      - name: Run fixtures import script
        env:
          DATE_RANGE: ${{ steps.daterange.outputs.DATE_RANGE }}
        run: |
          echo "▶ Kör fixtures-script för $DATE_RANGE"
          node scripts/fetch-and-import-fixtures.js "$DATE_RANGE"
